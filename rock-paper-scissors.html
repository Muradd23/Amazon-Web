<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="rockpaperscissorStyle.css">
</head>
<body>
    <p class="title">Rock Paper Scissors</p>
    <button class="options js-rock">Rock <img src="" alt="imagen"></button>
    <button class="options js-paper" >Paper <img src="" alt="imagen"></button>
    <button class="options js-scissors">Scissors <img src="" alt="imagen"></button>
    
    <p class="js-result"></p>
    <p class="js-pick"></p>
    <p class="js-score"></p>

    <button class="resetButton" onclick="
        score.wins=0
        score.losses=0
        score.ties=0
        localStorage.removeItem('score')
    ">Reset score</button>
    <button class="autoPlayButton" onclick="autoPlay()">Auto Play</button>
    <script src="rockpapperscissors.js"></script>
</body>
</html>
