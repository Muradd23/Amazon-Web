<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom Projects</title>
    <style>
        .subscribeButton{
            width: 100px;
            height: 30px;
            background-color: black;
            color: white;
            border: none;
            font-weight: bold;
            padding: auto;
            border-radius: 50px;
            cursor: pointer;
            margin-bottom: 30px;
        }
        .issubscribedButton{
            background-color: white;
            color: black;
            border: inset;
        }
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        .cost-input{
            font-size: 15px;
            padding: 10px;
        }
        .js-calculateButton{
            font-size: 15px;
            border-style: none;
            color: white;
            background-color: green;
            height: 40px;
            width: 80px;
            padding: 12px 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <p>Youtube Subscribe Button</p>
    <button class="subscribeButton" onclick="
        subscribe()
    " >Subscribe</button>


    <p>Amazon Shipping Calculator</p>
    <p>Orders under $40 =+$10 shipping</p>
    <p>Orders over $40 = FREE shipping</p>
    <input placeholder="Cost of Order" onkeydown="
    // console.log('typing');
        console.log(event)
    // console.log(event.key);
    handleCostKeyDown(event)
    " class="js-input cost-input" name="" id="">
    <button onclick="
        calculateTotal()
    "class="js-calculateButton">Calculate</button>
    <p class="js-order"></p>
    <script>

        function calculateTotal(){
            const jsInput = document.querySelector('.js-input').value
            let order = parseInt(jsInput)
            if(jsInput<40){
                order+=10
            }
            document.querySelector('.js-order').innerHTML=`$${order}`
        }

        function handleCostKeyDown(event){
            if(event.key==='Enter'){
                calculateTotal()
            }
        }

        function subscribe(){
            const buttonElement=  document.querySelector('.subscribeButton')

            if(buttonElement.innerText==='Subscribe'){
                buttonElement.innerHTML='Subscribed'
                buttonElement.classList.add('issubscribedButton')
                
            }else{
                buttonElement.innerHTML='Subscribe'
                buttonElement.classList.remove('issubscribedButton')
            }
        }

    </script>
</body>
</html>
